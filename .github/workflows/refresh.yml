name: refresh profile

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fixture tests for the card generators. They need no network, so a
      # regression here surfaces even when an upstream API is down.
      - name: Test card generators
        run: python3 .github/scripts/test_cards.py

      - name: Build DSA & CP card
        run: python3 .github/scripts/stats_card.py

      - name: Build GitHub stats and languages cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/github_card.py

      - name: Build contribution city
        run: python3 .github/scripts/city_card.py

      - name: Build open source card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/oss_card.py

      - name: Refresh projects showcase
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/projects.py

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: refresh profile stats"
          git push
